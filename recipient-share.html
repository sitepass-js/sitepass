  function recipientClientEventIdV576(prefix){

async function recipientFileBlobUrlV573(file,forceRefresh){
    file=file&&typeof file==='object'
      ? file
      : {};

    var fileId=String(
      file.file_id||
      file.fileId||
      file.id||
      ''
    ).trim();

    if(
      !/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(fileId)
    ){
      throw new Error('INVALID_RECIPIENT_FILE_ID');
    }

    var cacheKey='recipient-v2:'+fileId;
    var cached=signedUrlCacheV523[cacheKey];

    if(
      !forceRefresh &&
      cached &&
      cached.url &&
      cached.expiresAt>Date.now()+30000
    ){
      return cached.url;
    }

    if(
      forceRefresh &&
      cached &&
      /^blob:/i.test(String(cached.url||''))
    ){
      try{
        URL.revokeObjectURL(cached.url);
      }catch(e){}
    }

    var res=await timeoutFetch(
      RECIPIENT_FILE_DOWNLOAD_ENDPOINT,
      {
        method:'POST',
        headers:{
          'Content-Type':'application/json'
        },
        body:JSON.stringify({
          recipient_token:String(
            state.recipientToken||''
          ).trim(),
          file_id:fileId,
          disposition:'inline'
        })
      },
      12000
    );

    if(!res.ok){
      throw new Error(
        'RECIPIENT_FILE_HTTP_'+res.status
      );
    }

    var blob=await res.blob();

    if(!blob||!blob.size){
      throw new Error(
        'RECIPIENT_FILE_EMPTY'
      );
    }

    var url=URL.createObjectURL(blob);

    signedUrlCacheV523[cacheKey]={
      url:url,
      expiresAt:
        Date.now()+
        SIGNED_URL_TTL*1000
    };

    return url;
  }

      missing

        : '선택한 서류를 ZIP 파일로 준비하고 있습니다.'
    );

    var files=[];
    var fail=0;
    var usedNames={};

    for(var i=0;i<available.length;i++){
      var doc=state.docs[available[i]];
      if(!doc)continue;

      var entries=pageEntriesForDoc(doc);

      for(var j=0;j<entries.length;j++){
        try{
          if(!entries[j].candidates.length){
            fail++;
            continue;
          }

          var found=null;

          if(
            entries[j].page&&
            entries[j].page.recipientTokenV2===true
          ){
            // 다운로드 순간 서버 재검증. Edge 승인 실패 시 기존 blob으로 fallback하지 않는다.
            var freshBlob=await recipientFileBlobForDownloadV583(
              entries[j].page
            );
            found={blob:freshBlob,url:''};
          }else{
            found=await fetchFirstBlob(entries[j].candidates);
          }

          if(!found||!found.blob){
            fail++;
            continue;
          }

          var name=uniqueZipFileNameV573(
            fileNameFor(entries[j],available[i]),
            usedNames
          );

          files.push({
            name:name,
            blob:found.blob,
            fileId:recipientManifestFileIdV573(entries[j].page)
          });
        }catch(e){
          fail++;
        }
      }
    }

    if(!files.length){
      showToast('ZIP 파일에 넣을 수 있는 원본 서류가 없습니다.');
      return;
    }

    try{
      var zipBlob=await buildZipBlobV573(files);

      var equipmentNo=firstValue(
        state.item||{},
        [
          'equipmentNo',
          'equipment_no',
          'registrationNo',
          'registration_no',
          'vehicleNo',
          'vehicle_no'
        ]
      )||'SitePass';

      var zipName=
        safeZipFileNameV573(equipmentNo)+
        '_선택서류.zip';

      saveBlob(zipBlob,zipName);

      // ZIP에 실제 포함된 Recipient V2 파일만 downloaded 기록.
      // 이벤트 실패는 이미 시작된 다운로드를 막지 않는다.
      recordRecipientFilesV576(
        'downloaded',
        files.map(function(file){return file.fileId;}),
        recipientClientEventIdV576('downloaded')
      );

      if(fail||missing){
        showToast(
          'ZIP 다운로드 '+files.length+
          '개 완료, 일부 원본은 포함하지 못했습니다.'
        );
      }else{
        showToast(
          files.length+
          '개 파일을 ZIP 1개로 다운로드했습니다.'
        );
      }
    }catch(e){
      console.error('[SitePass ZIP]',e);
      showToast('ZIP 파일을 만드는 중 오류가 발생했습니다.');
    }
  }

  async function printSelected(indexes){
    if(!indexes.length){showToast('인쇄할 서류를 선택해주세요.');return;}

    /*
     * v575 print-only fix:
     * Recipient Token V2 파일은 blob: URL을 사용하므로 URL 확장자만으로
     * JPG/PDF를 판정하지 않는다. 실제 Blob MIME을 확인해 이미지가
     * iframe으로 잘못 들어가 표지/서류제목이 사라지는 인쇄 회귀를 막는다.
     */
    var win=window.open('','_blank');
    if(!win){showToast('팝업 차단을 해제해주세요.');return;}

    var pages=[],included=[],freshPrintUrlsV584=[];

    for(var x=0;x<indexes.length;x++){
      var index=indexes[x];
      var doc=state.docs[index];
      if(!doc)continue;

      var entries=pageEntriesForDoc(doc);
      var added=false;

      for(var y=0;y<entries.length;y++){
        var entry=entries[y];
        if(!entry.candidates.length)continue;

        var printUrl=entry.candidates[0];
        var printPdf=!!entry.pdf;

        try{
          var found=null;

          if(
            entry.page&&
            entry.page.recipientTokenV2===true
          ){
            // v584 / 47단계: 인쇄 버튼을 누르는 순간 Recipient V2 File Edge에서
            // 다시 승인받는다. 실패한 파일은 기존 미리보기 blob으로 fallback하지 않는다.
            var freshPrintBlobV584=await recipientFileBlobForDownloadV583(
              entry.page
            );
            var freshPrintUrlV584=URL.createObjectURL(freshPrintBlobV584);
            freshPrintUrlsV584.push(freshPrintUrlV584);
            found={blob:freshPrintBlobV584,url:freshPrintUrlV584};
          }else{
            found=await fetchFirstBlob(entry.candidates);
          }

          if(found&&found.blob){
            printUrl=found.url||printUrl;

            var actualMime=String(found.blob.type||'').toLowerCase();
            if(/^image\//i.test(actualMime)){
              printPdf=false;
            }else if(/(?:application\/pdf|\bpdf\b)/i.test(actualMime)){
              printPdf=true;
            }else{
              var actualName=String(entry.name||'');
              if(/\.pdf$/i.test(actualName))printPdf=true;
              else if(/\.(?:jpe?g|png|webp)$/i.test(actualName))printPdf=false;
            }
          }
        }catch(e){
          if(
            entry.page&&
            entry.page.recipientTokenV2===true
          ){
            continue;
          }
          /* Recipient V2가 아닌 기존 경로는 571 판정값 fallback 유지 */
        }

        pages.push({
          title:doc.title,
          url:printUrl,
          pdf:printPdf,
          pageNo:entry.index+1,
          totalPages:entries.length,
          fileId:recipientManifestFileIdV573(entry.page)
        });
        added=true;
      }

      if(added)included.push(doc.title);
    }

    if(!pages.length){
      try{win.close();}catch(e){}
      freshPrintUrlsV584.forEach(function(url){try{URL.revokeObjectURL(url);}catch(ignore){}});
      showToast('선택한 서류의 서버 원본이 없어 인쇄할 수 없습니다.');
      return;
    }

    var equipmentNo=firstValue(state.item,['equipmentNo','equipment_no','registrationNo','registration_no'])||'-';
    var equipmentName=firstValue(state.item,['equipmentName','equipment_name','name','title'])||'-';
    var includedHtml=included.map(function(title){return '<li>'+esc(title)+'</li>';}).join('');
    var documentHtml=pages.map(function(p,index){
      var pageLabel=p.totalPages>1?' <span>'+(p.pageNo)+' / '+p.totalPages+'페이지</span>':'';
      var media=p.pdf
        ? '<iframe src="'+esc(p.url)+'" title="'+esc(p.title)+'"></iframe>'
        : '<img src="'+esc(p.url)+'" alt="'+esc(p.title)+'">';
      return '<section class="print-page"><header><strong>'+(index+1)+'. '+esc(p.title)+'</strong>'+pageLabel+'</header><div class="media">'+media+'</div></section>';
    }).join('');
    var html='<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SitePass 서류 인쇄</title><style>'+ 
      '*{box-sizing:border-box}html,body{margin:0;padding:0;font-family:Arial,"Noto Sans KR",sans-serif;color:#111;background:#e9edf3}'+
      '.cover-page,.print-page{width:190mm;height:277mm;margin:10mm auto;background:#fff;overflow:hidden;break-after:page;page-break-after:always}'+
      '.cover-page{display:flex;flex-direction:column;justify-content:center;padding:22mm 18mm;border:1px solid #d7dce5}'+
      '.cover-page h1{font-size:28px;margin:0 0 18mm;text-align:center}.cover-info{border-top:2px solid #111;border-bottom:2px solid #111}'+
      '.cover-row{display:grid;grid-template-columns:42mm 1fr;border-bottom:1px solid #d9dde5;min-height:16mm;align-items:center}.cover-row:last-child{border-bottom:0}'+
      '.cover-row b{padding:4mm;font-size:15px}.cover-row div{padding:4mm;font-size:16px;border-left:1px solid #d9dde5;word-break:break-word}'+
      '.cover-row ul{margin:0;padding-left:6mm;line-height:1.7}.cover-count{margin-top:8mm;text-align:right;font-size:13px;color:#555}'+
      '.print-page{display:flex;flex-direction:column;padding:0}'+
      '.print-page header{height:14mm;flex:0 0 14mm;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #cfd5df;padding:0 3mm;font-size:15px}'+
      '.print-page header span{font-size:11px;color:#667085}.media{height:263mm;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:3mm 0 0}'+
      '.media img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}'+
      '.media iframe{display:block;width:100%;height:100%;border:0}'+
      '.print-page:last-of-type{break-after:auto;page-break-after:auto}'+
      '@page{size:A4 portrait;margin:10mm}@media print{html,body{background:#fff}.cover-page,.print-page{width:190mm;height:277mm;margin:0;box-shadow:none}.cover-page{border:0}}'+
      '</style></head><body><section class="cover-page"><h1>SitePass 장비서류</h1><div class="cover-info">'+
      '<div class="cover-row"><b>장비 등록번호</b><div>'+esc(equipmentNo)+'</div></div>'+
      '<div class="cover-row"><b>장비명</b><div>'+esc(equipmentName)+'</div></div>'+
      '<div class="cover-row"><b>포함서류</b><div><ul>'+includedHtml+'</ul></div></div></div>'+
      '<div class="cover-count">표지 1장 + 첨부서류 '+pages.length+'장 = 총 '+(pages.length+1)+'장</div></section>'+documentHtml+
      '<script>(function(){var done=false;function printNow(){if(done)return;done=true;setTimeout(function(){window.focus();window.print();},250)}window.addEventListener("load",function(){var media=Array.prototype.slice.call(document.querySelectorAll("img,iframe"));if(!media.length){printNow();return;}var remain=media.length;function one(){remain-=1;if(remain<=0)printNow()}media.forEach(function(el){if(el.tagName==="IMG"&&el.complete){one();return;}el.addEventListener("load",one,{once:true});el.addEventListener("error",one,{once:true});});setTimeout(printNow,5000);});})();<\/script></body></html>';
    win.document.open();win.document.write(html);win.document.close();

    // fresh blob URL은 571 인쇄창이 충분히 로드된 뒤 정리한다.
    if(freshPrintUrlsV584.length){
      setTimeout(function(){
        freshPrintUrlsV584.forEach(function(url){try{URL.revokeObjectURL(url);}catch(ignore){}});
      },300000);
    }

    // 기존 571 Golden 인쇄 HTML/printNow 로직은 그대로 두고,
    // 정상 인쇄창 준비가 끝난 뒤 포함된 Recipient V2 파일만 printed 기록한다.
    recordRecipientFilesV576(
      'printed',
      pages.map(function(page){return page.fileId;}),
      recipientClientEventIdV576('printed')
    );
  }

  async function copyLink(){var text=makeExternalLink();try{await navigator.clipboard.writeText(text);showToast('담당자 링크를 복사했습니다.');}catch(e){var area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();try{document.execCommand('copy');showToast('담당자 링크를 복사했습니다.');}catch(ignore){prompt('아래 링크를 복사해주세요.',text);}area.remove();}}
  function showToast(message){var old=document.querySelector('.toast');if(old)old.remove();var toast=document.createElement('div');toast.className='toast';toast.textContent=message;document.body.appendChild(toast);setTimeout(function(){toast.remove();},2600);}

  document.addEventListener('change',function(event){if(event.target&&event.target.matches&&event.target.matches('[data-doc-check]'))updateSelectionState();});
  document.addEventListener('click',function(event){
    var detail=event.target.closest&&event.target.closest('[data-detail-index]');if(detail){event.preventDefault();openDetail(detail.getAttribute('data-detail-index'));return;}
    var preview=event.target.closest&&event.target.closest('[data-open-detail]');if(preview){event.preventDefault();openDetail(preview.getAttribute('data-open-detail'));return;}
    var retry=event.target.closest&&event.target.closest('[data-retry]');if(retry){event.preventDefault();state.rendered=false;load();return;}
    var close=event.target.closest&&event.target.closest('[data-close-modal]');if(close){event.preventDefault();closeModal();return;}
    var memberTarget=event.target.closest&&event.target.closest('[data-member-target]');if(memberTarget){event.preventDefault();goMemberScreen(memberTarget.getAttribute('data-member-target'));return;}
    if(event.target.closest&&event.target.closest('[data-select-all]')){event.preventDefault();setAllChecks(true);return;}
    if(event.target.closest&&event.target.closest('[data-clear-selection]')){event.preventDefault();setAllChecks(false);return;}
    if(event.target.closest&&event.target.closest('[data-download-selected]')){event.preventDefault();downloadDocs(selectedIndexes(false));return;}
    if(event.target.closest&&event.target.closest('[data-print-selected]')){event.preventDefault();printSelected(selectedIndexes(false));return;}
  });
  document.addEventListener('keydown',function(event){if(event.key==='Escape')closeModal();});
  window.addEventListener('pagehide',function(){Object.keys(signedUrlCacheV523).forEach(function(key){var row=signedUrlCacheV523[key];if(row&&/^blob:/i.test(String(row.url||''))){try{URL.revokeObjectURL(row.url);}catch(e){}}});signedUrlCacheV523={};});
  var route=parseRoute();state.code=route.code;state.sig=route.sig;state.recipientToken=route.recipientToken||'';state.trackingToken=route.trackingToken;state.memberPreviewToken=route.previewToken||'';state.fromMember=verifyMemberPreviewV542(route);setExitMode();clearExternalRecipientSnapshotsV677();if(state.recipientToken){loadRecipientTokenV573();}else{load();}
})();
