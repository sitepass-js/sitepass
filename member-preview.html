<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3f6fb">
  <meta name="robots" content="noindex,nofollow">
  <title>SitePass 회원 서류 미리보기</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;color:#17243b;background:#f3f6fb}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f3f6fb}body{padding:0}
    button,a{font:inherit}.shell{width:min(760px,100%);margin:0 auto;padding:10px 12px 112px}.card{padding:17px;border:1px solid #dfe7f2;border-radius:18px;background:#fff;box-shadow:0 7px 22px rgba(31,50,84,.07)}
    .top-nav{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:14px 0 0;padding:9px 10px;border:1px solid #dbe5f2;border-radius:14px;background:rgba(255,255,255,.97);box-shadow:0 6px 20px rgba(35,57,94,.11);backdrop-filter:blur(10px)}
    .nav-btn{min-height:44px;padding:10px 14px;border:0;border-radius:12px;background:#173f7a;color:#fff;font-weight:900;cursor:pointer}.nav-label{color:#66738a;font-size:12px;font-weight:800;text-align:right}
    .hero .eyebrow{color:#168eea;font-size:12px;font-weight:900}.hero h1{margin:7px 0 8px;font-size:25px;line-height:1.3;letter-spacing:-.8px}.hero p{margin:0;color:#64728a;font-size:14px;line-height:1.65}.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}.status-grid span{padding:9px 6px;border-radius:10px;background:#eef5ff;color:#194f96;font-size:12px;font-weight:900;text-align:center}
    .info-card{margin-top:12px}.info-row{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;padding:12px 0;border-bottom:1px solid #edf1f6}.info-row:last-child{border-bottom:0}.info-row b{flex:0 0 105px;color:#506079;font-size:13px}.info-row span{min-width:0;text-align:right;font-weight:800;word-break:break-word}.expire{margin-top:10px;padding:14px;border-radius:13px;background:#fff8e8;color:#79540a;line-height:1.6;font-size:13px}.expire strong{display:block;color:#563b05;font-size:15px}
    .section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 2px 10px}.section-title h2{margin:0;font-size:19px}.section-title span{color:#6b7890;font-size:12px;font-weight:800}
    .toolbar{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));z-index:9997;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;width:min(736px,calc(100% - 24px));margin:0;padding:7px;transform:translateX(-50%);border:1px solid #dce5f0;border-radius:14px;background:rgba(255,255,255,.97);box-shadow:0 8px 26px rgba(30,48,80,.18);backdrop-filter:blur(12px)}.tool-btn{min-width:0;min-height:40px;padding:8px 6px;border:0;border-radius:10px;font-size:13px;line-height:1.15;font-weight:900;letter-spacing:-.3px;white-space:nowrap;cursor:pointer}.tool-btn.primary{background:#165fc3;color:#fff}.tool-btn.dark{background:#26344b;color:#fff}.tool-btn.light{background:#edf4fd;color:#1553a4}.tool-btn.soft{background:#f0f2f6;color:#445268}.tool-btn:disabled{opacity:.45;cursor:not-allowed}
    .docs{display:grid;gap:12px}.docs+.notice{margin-bottom:2px}.doc-card{padding:15px;border:1px solid #dfe7f2;border-radius:17px;background:#fff;box-shadow:0 7px 22px rgba(31,50,84,.07)}.doc-head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}.doc-title{display:flex;gap:10px;align-items:flex-start;min-width:0}.doc-check{flex:0 0 auto;width:21px;height:21px;margin:1px 0 0;accent-color:#165fc3}.doc-title-text{min-width:0}.doc-title small{display:block;margin-bottom:3px;color:#6e7b91;font-weight:800}.doc-title strong{display:block;font-size:17px;line-height:1.35;word-break:keep-all}.badge{flex:0 0 auto;padding:6px 9px;border-radius:999px;background:#e9f8ef;color:#17834a;font-size:11px;font-weight:900}.badge.missing{background:#fff0f0;color:#a23838}.doc-meta{margin-top:9px;color:#68758b;font-size:12px;line-height:1.55}
    .doc-preview{position:relative;display:flex;align-items:center;justify-content:center;min-height:150px;margin-top:12px;overflow:hidden;border:1px solid #e2e8f1;border-radius:13px;background:#f7f9fc}.doc-preview img{display:block;width:100%;max-height:420px;object-fit:contain;background:#fff}.doc-preview .preview-placeholder{padding:24px 14px;color:#768399;font-size:13px;font-weight:800;text-align:center;line-height:1.6}.doc-preview .pdf-mark{display:flex;flex-direction:column;align-items:center;gap:7px;padding:28px 12px;color:#44546d;font-weight:900}.doc-preview .pdf-mark b{font-size:27px;color:#d94141}.doc-preview .page-count{position:absolute;right:9px;bottom:9px;padding:5px 8px;border-radius:999px;background:rgba(24,37,58,.82);color:#fff;font-size:11px;font-weight:900}
    .doc-actions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}.detail-btn{display:flex;min-height:34px;align-items:center;justify-content:center;border:0;border-radius:12px;background:#165fc3;color:#fff;font-weight:900;text-decoration:none;cursor:pointer}
    .loading,.error,.empty{min-height:46vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:30px 18px;text-align:center}.spinner{width:42px;height:42px;border:4px solid #dfe7f5;border-top-color:#168eea;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.loading b,.error b,.empty b{font-size:18px}.loading span,.error span,.empty span{max-width:520px;color:#68758b;font-size:14px;line-height:1.65}.retry{min-width:180px;min-height:46px;border:0;border-radius:12px;background:#165fc3;color:#fff;font-weight:900;cursor:pointer}
    .notice{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:12px;padding:13px;border-radius:12px;background:#f2f6fb;color:#58677e;font-size:12px;line-height:1.5;text-align:center}.notice .retry{min-width:0;min-height:32px;padding:5px 11px;border-radius:9px;font-size:12px;line-height:1.1;white-space:nowrap}.member-bottom-nav{display:none}.member-bottom-nav button{appearance:none;border:0;background:transparent;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#6b7280;font-size:11px;font-weight:850;cursor:pointer}.member-bottom-nav button span{display:inline-flex;align-items:center;justify-content:center;min-height:22px;font-size:20px;line-height:1}.member-bottom-nav button span svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.member-bottom-nav button.active{color:#f5a800;background:#fff8df}body.member-preview-mode .member-bottom-nav{position:fixed;left:50%;bottom:0;z-index:9998;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;width:min(760px,100%);height:74px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));transform:translateX(-50%);border-top:1px solid #e5eaf2;background:rgba(255,255,255,.98);box-shadow:0 -10px 28px rgba(15,23,42,.10);backdrop-filter:blur(12px)}body.member-preview-mode .toolbar{bottom:calc(76px + env(safe-area-inset-bottom))}body.member-preview-mode .shell{padding-bottom:190px}body.member-preview-mode .top-nav{display:none}.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));z-index:2147483647;max-width:calc(100% - 28px);padding:12px 16px;border-radius:12px;background:#17243b;color:#fff;font-size:13px;font-weight:900;box-shadow:0 12px 30px rgba(0,0,0,.28);transform:translateX(-50%)}
    .modal{position:fixed;inset:0;z-index:2147483646;display:flex;align-items:center;justify-content:center;padding:16px}.backdrop{position:absolute;inset:0;background:rgba(9,18,34,.76)}.sheet{position:relative;z-index:1;display:flex;flex-direction:column;width:min(760px,calc(100vw - 48px));max-height:92vh;overflow:hidden;border-radius:20px;background:#fff;box-shadow:0 28px 90px rgba(0,0,0,.38)}.modal-head{display:flex;gap:15px;align-items:flex-start;justify-content:space-between;padding:15px 17px;border-bottom:1px solid #e4e9f2}.modal-head small{display:block;color:#6c798f;font-weight:800}.modal-head strong{display:block;margin-top:3px;font-size:18px}.close-x{flex:0 0 42px;width:42px;height:42px;border:0;border-radius:50%;background:#edf1f7;color:#26344b;font-size:29px;line-height:1;cursor:pointer}.modal-body{flex:1 1 auto;overflow:auto;padding:14px;background:#edf2f7}.page{width:min(680px,100%);margin:0 auto 14px;padding:10px;border-radius:13px;background:#fff;box-shadow:0 4px 17px rgba(26,42,72,.10)}.page-title{margin-bottom:9px;color:#42516a;font-size:13px;font-weight:900;word-break:break-all}.page img{display:block;width:auto;max-width:100%;max-height:68vh;height:auto;margin:auto;background:#fff;object-fit:contain}.page iframe,.page object{display:block;width:100%;height:68vh;min-height:460px;border:0;background:#fff}.missing-page{padding:35px 16px;border-radius:12px;background:#fff2f2;color:#9a3838;text-align:center;line-height:1.6}.close-bottom{min-height:50px;margin:10px 16px 15px;border:0;border-radius:12px;background:#1f293b;color:#fff;font-weight:900;cursor:pointer}body.modal-open{overflow:hidden}
    /* STEP83 V37 UI-only: PC 회원 미리보기 하단 5탭을 메인 SitePass 하단 5탭과 시각적으로 맞춥니다. 모바일(<=680px), 문서/QR/token/download/print 로직은 변경하지 않습니다. */
    @media(min-width:681px){.shell{width:min(992px,100%)}.toolbar{width:min(968px,calc(100% - 24px))}body.member-preview-mode .member-bottom-nav{width:min(992px,100%);height:74px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:4px;background:#fff;border:0;border-radius:0;box-shadow:none;backdrop-filter:none}.member-bottom-nav button{min-height:58px;border-radius:0;gap:4px;color:#64748b}.member-bottom-nav button span{width:28px;height:28px;min-height:28px}.member-bottom-nav button span svg{width:24px;height:24px}.member-bottom-nav button b{font-size:14px;line-height:1.15;font-weight:850}.member-bottom-nav button.active{color:#c78800;background:transparent;box-shadow:none}}
    @media(max-width:680px){.shell{padding:8px 8px 22px}.top-nav{border-radius:12px}.nav-btn{width:100%}.nav-label{display:none}.card{padding:14px}.hero h1{font-size:22px}.status-grid{grid-template-columns:1fr}.info-row b{flex-basis:92px}.toolbar{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;width:calc(100% - 12px);padding:6px}.tool-btn{min-height:38px;padding:6px 2px;font-size:11px;letter-spacing:-.65px}.doc-actions{grid-template-columns:1fr;gap:6px}.detail-btn{min-height:31px;font-size:12px}.modal{padding:0}.sheet{width:100%;max-height:100vh;border-radius:0}.modal-body{padding:8px}.page{padding:7px;border-radius:9px}.page img{width:100%;max-height:none}.page iframe,.page object{height:75vh;min-height:420px}.notice{display:flex;flex-direction:column;gap:6px;padding:11px 10px;line-height:1.45}.notice .retry{min-width:120px;min-height:32px;margin:0}}
  </style>
</head>
<body class="member-preview-mode">
  <main class="shell">
    <nav class="top-nav" aria-label="회원 미리보기 이동">
      <button id="exitButton" class="nav-btn" type="button">← 보관함</button>
      <span class="nav-label">SitePass 회원 전용</span>
    </nav>
    <div id="content" class="card loading">
      <span class="spinner" aria-hidden="true"></span>
      <b>장비 서류를 확인하고 있습니다.</b>
      <span>로그인 권한과 현재 등록 서류를 확인하고 있습니다.</span>
    </div>
  </main>

  <nav id="memberBottomNav" class="member-bottom-nav" aria-label="SitePass 회원 하단 메뉴">
    <button type="button" data-member-target="homeScreen"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5"/><path d="M6 10v9h4.8v-5h2.4v5H18v-9"/></svg></span><b>홈</b></button>
    <button type="button" data-member-target="registerScreen"><span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3.5" width="10" height="16.5" rx="2"/><path d="M8 8h4M8 11.5h4"/><path d="M14.5 15.5 18.8 11l1.7 1.7-4.3 4.3-2.7.7z"/></svg></span><b>등록</b></button>
    <button type="button" class="active" data-member-target="listScreen"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 8h17v10.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><path d="M3.5 8 6 4.5h4.5l2 2h5.5L20.5 8"/></svg></span><b>보관함</b></button>
    <button type="button" data-member-target="contactScreen"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 5h15a2 2 0 0 1 2 2v8.5a2 2 0 0 1-2 2h-7.8L7 20.5v-3H4.5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/><path d="M7.5 11h.01M12 11h.01M16.5 11h.01"/></svg></span><b>알림/채팅</b></button>
    <button type="button" data-member-target="myAccountScreen"><span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.8"/><path d="M5 20a7 7 0 0 1 14 0"/></svg></span><b>내정보</b></button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./assets/js/config.js"></script>
  <script>
  (function(){
    'use strict';

    var client=window.sitepassSupabase;
    var content=document.getElementById('content');
    var exitButton=document.getElementById('exitButton');
    var state={docs:[],detail:null};
    var DOC_TITLES={businessLicense:'사업자등록증',equipmentRegistration:'장비등록증',equipmentInspection:'장비 검사증',insurancePolicy:'장비보험증권',specSheet:'장비제원표',ndtInspection:'장비비파괴검사증',equipmentLedger:'장비갑원부',otherEquipment:'기타 장비서류',driverIdCard:'기사 신분증',driverLicense:'기사 면허증',driverBasicSafetyTraining:'기사 건설기초안전보건교육 이수증',driverMachinerySafetyTraining:'기사 건설기계조종사 안전교육 이수증',driverSpecialHealthCheck:'기사 특수건강검진',otherDriverDoc:'기타 기사서류',workerIdCard:'인부 신분증',workerBasicSafetyTraining:'인부 건설기초안전보건교육 이수증',otherWorkerDoc:'기타 인부서류'};

    function esc(value){return String(value==null?'':value).replace(/[&<>'"]/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch];});}
    function equipmentIdFromRoute(){var v=String(new URLSearchParams(location.search||'').get('equipment_id')||'').trim();return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(v)?v:'';}
    function goArchive(){try{sessionStorage.setItem('sitepass_last_screen_v491','listScreen');}catch(e){}var u=new URL('./',location.href);u.search='';u.hash='';location.assign(u.toString());}
    function goMemberScreen(target){
      var allowed=['homeScreen','registerScreen','listScreen','contactScreen','myAccountScreen'];
      target=allowed.indexOf(String(target||''))>=0?String(target):'listScreen';
      closeModal();
      try{sessionStorage.setItem('sitepass_last_screen_v491',target);}catch(e){}
      var u=new URL('./',location.href);u.search='';u.hash='';location.assign(u.toString());
    }
    exitButton.addEventListener('click',goArchive);
    var memberBottomNav=document.getElementById('memberBottomNav');
    if(memberBottomNav){
      memberBottomNav.addEventListener('click',function(event){
        var button=event.target.closest('[data-member-target]');
        if(!button)return;
        goMemberScreen(button.getAttribute('data-member-target'));
      });
    }

    function renderError(title,message){content.className='card error';content.innerHTML='<b>'+esc(title)+'</b><span>'+esc(message||'')+'</span>';}
    function fmtDate(v){if(!v)return '';var d=new Date(v);if(isNaN(d.getTime()))return String(v);return d.getFullYear()+'. '+String(d.getMonth()+1).padStart(2,'0')+'. '+String(d.getDate()).padStart(2,'0')+'.';}
    function isPdf(file){var n=String(file.fileName||'').toLowerCase(),m=String(file.mimeType||'').toLowerCase();return m==='application/pdf'||/\.pdf$/i.test(n);}
    function isImage(file){var n=String(file.fileName||'').toLowerCase(),m=String(file.mimeType||'').toLowerCase();return /^image\//i.test(m)||/\.(jpe?g|png|webp|gif)$/i.test(n);}

    async function signedUrlFor(file){
      var bucket=String(file.storage_bucket||'sitepass-documents').trim();
      var path=String(file.storage_path||'').replace(/^\/+/, '');
      if(!bucket||!path)return '';
      var result=await client.storage.from(bucket).createSignedUrl(path,300);
      if(result.error)throw result.error;
      return String(result.data&&(result.data.signedUrl||result.data.signedURL)||'').trim();
    }

    async function normalizeDocuments(rows){
      var out=[];
      for(var i=0;i<(Array.isArray(rows)?rows:[]).length;i++){
        var raw=rows[i]||{}, ver=raw.current_version&&typeof raw.current_version==='object'?raw.current_version:null;
        if(!ver)continue;
        var files=[];
        var source=Array.isArray(ver.files)?ver.files:[];
        for(var j=0;j<source.length;j++){
          var f=source[j]||{};
          if(String(f.verification_status||'').toLowerCase()!=='verified')continue;
          var url='';
          try{url=await signedUrlFor(f);}catch(e){console.warn('[SitePass member preview] signed URL failed',e);}
          files.push({fileId:String(f.file_id||''),pageNo:Number(f.page_no||0),fileName:String(f.original_file_name||f.file_name||'첨부파일'),mimeType:String(f.mime_type||'').toLowerCase(),signedUrl:url});
        }
        files.sort(function(a,b){return (a.pageNo||9999)-(b.pageNo||9999)||String(a.fileName).localeCompare(String(b.fileName),'ko');});
        var key=String(raw.document_type||'').trim();
        out.push({key:key,title:DOC_TITLES[key]||key||'등록 서류',groupTitle:/driver/i.test(key)?'장비기사서류':/worker/i.test(key)?'인부서류':'장비서류',expireDate:String(ver.expiry_date||''),status:String(raw.status||''),files:files});
      }
      return out;
    }

    function previewHtml(doc,index){
      var files=doc.files||[], first=files.find(function(f){return !!f.signedUrl;})||null, count=Math.max(1,files.length||1);
      if(!first)return '<div class="doc-preview"><div class="preview-placeholder">첨부 정보는 있으나 파일주소를 준비하지 못했습니다.</div></div>';
      if(isPdf(first))return '<div class="doc-preview" data-detail-index="'+index+'"><div class="pdf-mark"><b>PDF</b><span>눌러서 미리보기</span></div><span class="page-count">'+count+'장</span></div>';
      if(isImage(first))return '<div class="doc-preview" data-detail-index="'+index+'"><img src="'+esc(first.signedUrl)+'" alt="'+esc(doc.title)+' 미리보기"><span class="page-count">'+count+'장</span></div>';
      return '<div class="doc-preview" data-detail-index="'+index+'"><div class="preview-placeholder">'+esc(first.fileName)+'<br>눌러서 파일을 확인하세요.</div><span class="page-count">'+count+'장</span></div>';
    }

    function render(detail,docs){
      state.detail=detail;state.docs=docs;
      var eq=detail&&detail.equipment||{};
      var name=String(eq.equipment_name||'장비').trim(), no=String(eq.equipment_no||eq.code||'-').trim();
      var groups=[];docs.forEach(function(d){if(groups.indexOf(d.groupTitle)<0)groups.push(d.groupTitle);});
      var docsHtml=docs.map(function(doc,index){
        var available=(doc.files||[]).filter(function(f){return !!f.signedUrl;}),meta=[];
        if(doc.files&&doc.files.length)meta.push(doc.files.length+'장');if(doc.expireDate)meta.push('만료 '+fmtDate(doc.expireDate));if(doc.status)meta.push(doc.status);
        return '<article class="doc-card" data-doc-index="'+index+'"><div class="doc-head"><label class="doc-title"><input class="doc-check" type="checkbox" data-doc-check value="'+index+'" checked><span class="doc-title-text"><small>'+esc(doc.groupTitle)+'</small><strong>'+(index+1)+'. '+esc(doc.title)+'</strong></span></label><span class="badge '+(available.length?'':'missing')+'">'+(available.length?'첨부됨':'파일확인')+'</span></div><div class="doc-meta">'+esc(meta.join(' · ')||((doc.files[0]||{}).fileName||'등록된 서류'))+'</div>'+previewHtml(doc,index)+'<div class="doc-actions"><button class="detail-btn" type="button" data-detail-index="'+index+'">상세보기</button></div></article>';
      }).join('');
      content.className='';

    }

    function closeModal(){var m=document.getElementById('docModal');if(m)m.remove();document.body.classList.remove('modal-open');}
    function openDetail(index){
      var doc=state.docs[Number(index)];if(!doc)return;closeModal();
      var modal=document.createElement('div');modal.id='docModal';modal.className='modal';
      var pages=(doc.files||[]).map(function(f,i){
        if(!f.signedUrl)return '<section class="page"><div class="page-title">'+(i+1)+'. '+esc(f.fileName)+'</div><div class="missing-page">파일 주소를 준비하지 못했습니다.</div></section>';
        var body=isPdf(f)?'<iframe src="'+esc(f.signedUrl)+'" title="'+esc(f.fileName)+'"></iframe>':isImage(f)?'<img src="'+esc(f.signedUrl)+'" alt="'+esc(f.fileName)+'">':'<div class="missing-page"><a href="'+esc(f.signedUrl)+'" target="_blank" rel="noopener">파일 열기</a></div>';
        return '<section class="page"><div class="page-title">'+(i+1)+'. '+esc(f.fileName)+'</div>'+body+'</section>';
      }).join('');

      document.body.appendChild(modal);document.body.classList.add('modal-open');

    function selectedFiles(){var indexes=Array.from(document.querySelectorAll('[data-doc-check]:checked')).map(function(x){return Number(x.value);}),out=[];indexes.forEach(function(i){(state.docs[i]&&state.docs[i].files||[]).forEach(function(f){if(f.signedUrl)out.push(f);});});return out;}
    function memberZipCrc32V575(bytes){
      var table=memberZipCrc32V575._table;
      if(!table){
        table=[];
        for(var n=0;n<256;n++){
          var c=n;
          for(var k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);
          table[n]=c>>>0;
        }
        memberZipCrc32V575._table=table;
      }
      var crc=0xFFFFFFFF;
      for(var i=0;i<bytes.length;i++)crc=table[(crc^bytes[i])&255]^(crc>>>8);
      return (crc^0xFFFFFFFF)>>>0;
    }
    function memberZipDosDateTimeV575(date){
      var d=date||new Date(),year=Math.max(1980,d.getFullYear());
      return {time:((d.getHours()&31)<<11)|((d.getMinutes()&63)<<5)|(Math.floor(d.getSeconds()/2)&31),date:(((year-1980)&127)<<9)|(((d.getMonth()+1)&15)<<5)|(d.getDate()&31)};
    }
    function memberSafeZipNameV575(name,fallback){
      var value=String(name||fallback||'sitepass-file').replace(/[\\/:*?"<>|]+/g,'_').trim();
      return value||String(fallback||'sitepass-file');
    }
    function memberUniqueZipNameV575(name,used){
      name=memberSafeZipNameV575(name,'sitepass-file');
      var dot=name.lastIndexOf('.'),base=dot>0?name.slice(0,dot):name,ext=dot>0?name.slice(dot):'',candidate=name,count=2;
      while(used[candidate.toLowerCase()]){candidate=base+' ('+count+')'+ext;count++;}
      used[candidate.toLowerCase()]=true;
      return candidate;
    }
    async function memberBuildZipBlobV575(files){
      var encoder=new TextEncoder(),localParts=[],centralParts=[],offset=0,centralSize=0;
      for(var i=0;i<files.length;i++){
        var nameBytes=encoder.encode(files[i].name),data=new Uint8Array(await files[i].blob.arrayBuffer()),crc=memberZipCrc32V575(data),dt=memberZipDosDateTimeV575(new Date());
        var local=new Uint8Array(30+nameBytes.length),lv=new DataView(local.buffer);
        lv.setUint32(0,0x04034b50,true);lv.setUint16(4,20,true);lv.setUint16(6,0x0800,true);lv.setUint16(8,0,true);lv.setUint16(10,dt.time,true);lv.setUint16(12,dt.date,true);lv.setUint32(14,crc,true);lv.setUint32(18,data.length,true);lv.setUint32(22,data.length,true);lv.setUint16(26,nameBytes.length,true);lv.setUint16(28,0,true);local.set(nameBytes,30);
        var central=new Uint8Array(46+nameBytes.length),cv=new DataView(central.buffer);
        cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0x0800,true);cv.setUint16(10,0,true);cv.setUint16(12,dt.time,true);cv.setUint16(14,dt.date,true);cv.setUint32(16,crc,true);cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);cv.setUint16(28,nameBytes.length,true);cv.setUint16(30,0,true);cv.setUint16(32,0,true);cv.setUint16(34,0,true);cv.setUint16(36,0,true);cv.setUint32(38,0,true);cv.setUint32(42,offset,true);central.set(nameBytes,46);
        localParts.push(local);localParts.push(data);centralParts.push(central);offset+=local.length+data.length;centralSize+=central.length;
      }
      var end=new Uint8Array(22),ev=new DataView(end.buffer);
      ev.setUint32(0,0x06054b50,true);ev.setUint16(4,0,true);ev.setUint16(6,0,true);ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);ev.setUint32(12,centralSize,true);ev.setUint32(16,offset,true);ev.setUint16(20,0,true);
      return new Blob(localParts.concat(centralParts).concat([end]),{type:'application/zip'});
    }
    function memberSaveZipV575(blob,name){
      var url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},2500);
    }
    async function downloadSelected(){
      var files=selectedFiles();
      if(!files.length){alert('다운로드할 서류를 선택해 주세요.');return;}
      var packed=[],used={};
      try{
        for(var i=0;i<files.length;i++){
          var f=files[i],res=await fetch(f.signedUrl,{method:'GET'});
          if(!res.ok)throw new Error('HTTP '+res.status);
          var blob=await res.blob();
          if(!blob||!blob.size)throw new Error('빈 파일');
          packed.push({name:memberUniqueZipNameV575(f.fileName||('sitepass-document-'+(i+1)),used),blob:blob});
        }
        var zip=await memberBuildZipBlobV575(packed),eq=state.detail&&state.detail.equipment||{},equipmentNo=String(eq.equipment_no||eq.code||'SitePass').trim()||'SitePass';
        memberSaveZipV575(zip,memberSafeZipNameV575(equipmentNo,'SitePass')+'_선택서류.zip');
      }catch(error){
        console.error('[SitePass member ZIP]',error);
        alert('선택한 서류를 ZIP 파일로 만드는 중 오류가 발생했습니다.');
      }
    }
    function printSelected(){
      var indexes=Array.from(document.querySelectorAll('[data-doc-check]:checked')).map(function(x){return Number(x.value);});
      if(!indexes.length){alert('인쇄할 서류를 선택해 주세요.');return;}

      var pages=[],included=[];
      indexes.forEach(function(index){
        var doc=state.docs[index];
        if(!doc)return;
        var files=(doc.files||[]).filter(function(f){return !!f.signedUrl;});
        var added=false;
        files.forEach(function(f,fileIndex){
          pages.push({
            title:doc.title,
            url:f.signedUrl,
            pdf:isPdf(f),
            image:isImage(f),
            fileName:f.fileName||doc.title,
            pageNo:fileIndex+1,
            totalPages:files.length
          });
          added=true;
        });
        if(added)included.push(doc.title);
      });

      if(!pages.length){alert('선택한 서류의 파일이 없어 인쇄할 수 없습니다.');return;}

      var w=window.open('','_blank');
      if(!w){alert('팝업이 차단되었습니다.');return;}

      var eq=state.detail&&state.detail.equipment||{};
      var equipmentNo=String(eq.equipment_no||eq.code||'-').trim()||'-';
      var equipmentName=String(eq.equipment_name||'장비').trim()||'장비';
      var includedHtml=included.map(function(title){return '<li>'+esc(title)+'</li>';}).join('');
      var documentHtml=pages.map(function(p,index){
        var pageLabel=p.totalPages>1?' <span>'+p.pageNo+' / '+p.totalPages+'페이지</span>':'';
        var media=p.pdf
          ? '<iframe src="'+esc(p.url)+'" title="'+esc(p.title)+'"></iframe>'
          : p.image
            ? '<img src="'+esc(p.url)+'" alt="'+esc(p.title)+'">'
            : '<a href="'+esc(p.url)+'">'+esc(p.fileName)+'</a>';
        return '<section class="print-page"><header><strong>'+(index+1)+'. '+esc(p.title)+'</strong>'+pageLabel+'</header><div class="media">'+media+'</div></section>';
      }).join('');

      var html='<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SitePass 서류 인쇄</title><style>'+ 
        '*{box-sizing:border-box}html,body{margin:0;padding:0;font-family:Arial,"Noto Sans KR",sans-serif;color:#111;background:#e9edf3}'+
        '.cover-page,.print-page{width:190mm;height:277mm;margin:10mm auto;background:#fff;overflow:hidden;break-after:page;page-break-after:always}'+
        '.cover-page{display:flex;flex-direction:column;justify-content:center;padding:22mm 18mm;border:1px solid #d7dce5}'+
        '.cover-page h1{font-size:28px;margin:0 0 18mm;text-align:center}.cover-info{border-top:2px solid #111;border-bottom:2px solid #111}'+
        '.cover-row{display:grid;grid-template-columns:42mm 1fr;border-bottom:1px solid #d9dde5;min-height:16mm;align-items:center}.cover-row:last-child{border-bottom:0}'+
        '.cover-row b{padding:4mm;font-size:15px}.cover-row div{padding:4mm;font-size:16px;border-left:1px solid #d9dde5;word-break:break-word}'+
        '.cover-row ul{margin:0;padding-left:6mm;line-height:1.7}.cover-count{margin-top:8mm;text-align:right;font-size:13px;color:#555}'+
        '.print-page{display:flex;flex-direction:column;padding:0}'+
        '.print-page header{height:14mm;flex:0 0 14mm;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #cfd5df;padding:0 3mm;font-size:15px}'+
        '.print-page header span{font-size:11px;color:#667085}.media{height:263mm;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:3mm 0 0}'+
        '.media img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}'+
        '.media iframe{display:block;width:100%;height:100%;border:0}'+
        '.media a{font-size:16px;word-break:break-all}'+
        '.print-page:last-of-type{break-after:auto;page-break-after:auto}'+
        '@page{size:A4 portrait;margin:10mm}@media print{html,body{background:#fff}.cover-page,.print-page{width:190mm;height:277mm;margin:0;box-shadow:none}.cover-page{border:0}}'+
        '</style></head><body><section class="cover-page"><h1>SitePass 장비서류</h1><div class="cover-info">'+
        '<div class="cover-row"><b>장비 등록번호</b><div>'+esc(equipmentNo)+'</div></div>'+
        '<div class="cover-row"><b>장비명</b><div>'+esc(equipmentName)+'</div></div>'+
        '<div class="cover-row"><b>포함서류</b><div><ul>'+includedHtml+'</ul></div></div></div>'+

        '<script>(function(){var done=false;function printNow(){if(done)return;done=true;setTimeout(function(){window.focus();window.print();},250)}window.addEventListener("load",function(){var media=Array.prototype.slice.call(document.querySelectorAll("img,iframe"));if(!media.length){printNow();return;}var remain=media.length;function one(){remain-=1;if(remain<=0)printNow()}media.forEach(function(el){if(el.tagName==="IMG"&&el.complete){one();return;}el.addEventListener("load",one,{once:true});el.addEventListener("error",one,{once:true});});setTimeout(printNow,5000);});})();<\/script></body></html>';

    document.addEventListener('click',function(e){
      var d=e.target.closest('[data-detail-index]');if(d){openDetail(d.getAttribute('data-detail-index'));return;}
      if(e.target.closest('[data-close-modal]')){closeModal();return;}

    async function start(){
      if(!client){renderError('미리보기 모듈을 불러오지 못했습니다.','브라우저를 새로고침한 뒤 다시 시도해 주세요.');return;}
      var equipmentId=equipmentIdFromRoute();
      if(!equipmentId){renderError('올바르지 않은 회원 미리보기 주소입니다.','보관함에서 장비를 다시 선택해 주세요.');return;}
      var sessionResult=await client.auth.getSession(),session=sessionResult.data&&sessionResult.data.session;
      if(!session||!session.user){renderError('로그인이 필요합니다.','SitePass에 로그인한 뒤 보관함에서 다시 열어 주세요.');return;}
      var rpc=await client.rpc('sitepass_get_equipment_detail_v1',{p_equipment_id:equipmentId});
      if(rpc.error){console.warn('[SitePass member preview] detail RPC blocked',rpc.error);renderError('장비를 조회할 수 없습니다.','장비 접근 권한이 없거나 사용할 수 없는 장비입니다.');return;}
      var detail=rpc.data&&typeof rpc.data==='object'?rpc.data:null;
      if(!detail||!detail.equipment||String(detail.equipment.equipment_id||'')!==equipmentId){renderError('장비를 확인하지 못했습니다.','보관함으로 돌아가 다시 시도해 주세요.');return;}
      var docs=await normalizeDocuments(detail.documents);
      render(detail,docs);
    }
    start().catch(function(err){console.error('[SitePass member preview] fatal',err);renderError('회원 미리보기를 불러오지 못했습니다.','보관함으로 돌아가 다시 시도해 주세요.');});
  })();
